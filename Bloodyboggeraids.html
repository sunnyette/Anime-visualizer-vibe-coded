<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BPM Mobile Visualizer - Color Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #stage {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vid-layer, canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      aspect-ratio: 4 / 3;
    }

    .vid-layer {
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.1s linear;
      z-index: 1;
    }

    .vid-layer.active {
      opacity: 1;
      z-index: 2;
    }

    canvas {
      z-index: 5;
      pointer-events: none;
      mix-blend-mode: difference;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    #ui-layer {
      position: absolute;
      z-index: 10;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(18, 18, 24, 0.92);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      width: 90%;
      max-width: 420px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #ui-layer.hidden {
      opacity: 0;
      transform: translate(-50%, -45%);
      pointer-events: none;
    }

    h1 { font-size: 1.3rem; margin-bottom: 10px; color: #107c41; text-align: center; }

    .color-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      background: #333;
      color: #fff;
      text-align: center;
      margin: 0 auto 10px auto;
    }

    .badge-container { text-align: center; }

    .file-box {
      background: #22222a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    label { display: block; font-size: 0.85rem; color: #bbb; margin-bottom: 6px; font-weight: 600; }

    input[type="file"] {
      width: 100%;
      font-size: 0.85rem;
      color: #ccc;
    }

    /* Clip List Styling */
    .clip-list-container {
      margin-top: 10px;
      max-height: 160px;
      overflow-y: auto;
      border-top: 1px solid #333;
      padding-top: 8px;
    }

    .clip-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #181820;
      border: 1px solid #2a2a35;
      padding: 6px 8px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .clip-thumb {
      width: 48px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
      background: #000;
      flex-shrink: 0;
    }

    .clip-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .clip-name {
      font-size: 0.75rem;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .clip-color-tag {
      font-size: 0.65rem;
      color: #107c41;
      font-weight: bold;
    }

    .btn-del-clip {
      background: rgba(255, 60, 60, 0.2);
      border: 1px solid rgba(255, 60, 60, 0.4);
      color: #ff6666;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-del-clip:hover {
      background: rgba(255, 60, 60, 0.4);
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #aaa;
    }

    input[type="range"] {
      width: 100%;
      height: 24px;
      accent-color: #107c41;
    }

    button.btn-primary {
      width: 100%;
      padding: 14px;
      background: #107c41;
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 12px;
      margin-top: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 124, 65, 0.4);
    }

    button.btn-secondary {
      width: 100%;
      padding: 8px;
      background: rgba(255, 50, 50, 0.2);
      border: 1px solid rgba(255, 50, 50, 0.4);
      color: #ff8888;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }

    #toggle-ui-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 20;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #status-text {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div id="stage">
    <video id="bg-video-1" class="vid-layer active" autoplay loop muted playsinline webkit-playsinline></video>
    <video id="bg-video-2" class="vid-layer" autoplay loop muted playsinline webkit-playsinline></video>
    <canvas id="wave-canvas"></canvas>
  </div>

  <button id="toggle-ui-btn">⚙️</button>

  <div id="ui-layer">
    <h1>BPM Mobile Visualizer</h1>
    <div class="badge-container">
      <span id="color-badge" class="color-badge">Active Color: Scanning...</span>
    </div>

    <div class="file-box">
      <label>1. Music Track (.mp3, .wav, .m4a)</label>
      <input type="file" id="audio-input" accept="audio/*">
    </div>

    <div class="file-box">
      <label>2. Anime Video Clips (.mp4, .mov)</label>
      <input type="file" id="video-input" accept="video/*" multiple>
      <div class="clip-list-container">
        <div id="clip-list"></div>
      </div>
    </div>

    <div class="slider-row">
      <div class="slider-label">
        <span>Min Time Between Cuts (Sec)</span>
        <span id="hold-val">1.8s</span>
      </div>
      <input type="range" id="hold-slider" min="0.8" max="4.0" step="0.1" value="1.8">
    </div>

    <div class="slider-row">
      <div class="slider-label">
        <span>Bass Volume Required to Cut</span>
        <span id="sens-val">150</span>
      </div>
      <input type="range" id="sens-slider" min="100" max="220" value="150">
    </div>

    <div class="slider-row">
      <div class="slider-label">
        <span>Pause Cuts Below Volume</span>
        <span id="quiet-val">30</span>
      </div>
      <input type="range" id="quiet-slider" min="5" max="80" value="30">
    </div>

    <div class="slider-row">
      <div class="slider-label">
        <span>Hide Line Above Volume</span>
        <span id="hide-val">160</span>
      </div>
      <input type="range" id="hide-slider" min="50" max="255" value="160">
    </div>

    <button id="start-btn" class="btn-primary">START / PAUSE</button>
    <button id="clear-btn" class="btn-secondary">Clear All Saved Media</button>
    <div id="status-text">Checking saved files...</div>
  </div>

  <script>
    // Video Clip Object: { id: string, url: string, colorGroup: string, hue: number, name: string }
    let videoClips = [];
    let recentClips = []; // Memory queue up to 7 clips
    let audioBuffer = null;
    let rawAudioArrayBuffer = null;
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let isPlaying = false;
    let lastBeatTime = 0;
    let smoothedEnergy = 0;
    let smoothedBass = 0;
    let currentClipObject = null;

    let videoA = document.getElementById('bg-video-1');
    let videoB = document.getElementById('bg-video-2');
    let activeVideo = videoA;
    let inactiveVideo = videoB;
    let isSwapping = false;

    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');
    const uiLayer = document.getElementById('ui-layer');
    const startBtn = document.getElementById('start-btn');
    const clearBtn = document.getElementById('clear-btn');
    const toggleUiBtn = document.getElementById('toggle-ui-btn');
    const statusText = document.getElementById('status-text');
    const colorBadge = document.getElementById('color-badge');

    const sensSlider = document.getElementById('sens-slider');
    const quietSlider = document.getElementById('quiet-slider');
    const hideSlider = document.getElementById('hide-slider');
    const holdSlider = document.getElementById('hold-slider');

    const COLOR_NEIGHBORS = {
      'Red': ['Red', 'Pink', 'Orange', 'Purple', 'Yellow'],
      'Orange': ['Orange', 'Red', 'Yellow', 'Pink', 'Green'],
      'Yellow': ['Yellow', 'Orange', 'Green', 'Red', 'Cyan'],
      'Green': ['Green', 'Yellow', 'Cyan', 'Orange', 'Blue'],
      'Cyan': ['Cyan', 'Green', 'Blue', 'Yellow', 'Purple'],
      'Blue': ['Blue', 'Cyan', 'Purple', 'Green', 'Pink'],
      'Purple': ['Purple', 'Blue', 'Pink', 'Cyan', 'Red'],
      'Pink': ['Pink', 'Purple', 'Red', 'Blue', 'Orange']
    };

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);

    // --- COLOR ANALYSIS ENGINE ---
    const sampleCanvas = document.createElement('canvas');
    sampleCanvas.width = 16;
    sampleCanvas.height = 16;
    const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;

      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return { hue: Math.round(h * 360), sat: Math.round(s * 100), light: Math.round(l * 100) };
    }

    function getHueGroup(hue) {
      if (hue >= 345 || hue < 15) return 'Red';
      if (hue >= 15 && hue < 45) return 'Orange';
      if (hue >= 45 && hue < 75) return 'Yellow';
      if (hue >= 75 && hue < 165) return 'Green';
      if (hue >= 165 && hue < 195) return 'Cyan';
      if (hue >= 195 && hue < 255) return 'Blue';
      if (hue >= 255 && hue < 305) return 'Purple';
      return 'Pink';
    }

    async function analyzeVideoColor(blobUrl) {
      return new Promise((resolve) => {
        const tempVideo = document.createElement('video');
        tempVideo.muted = true;
        tempVideo.playsInline = true;
        tempVideo.src = blobUrl;

        const cleanup = () => {
          tempVideo.removeAttribute('src');
          tempVideo.load();
        };

        tempVideo.onloadeddata = () => {
          tempVideo.currentTime = Math.min(1.0, (tempVideo.duration || 2) / 2);
        };

        tempVideo.onseeked = () => {
          try {
            sampleCtx.drawImage(tempVideo, 0, 0, 16, 16);
            const imgData = sampleCtx.getImageData(0, 0, 16, 16).data;
            let rTotal = 0, gTotal = 0, bTotal = 0;
            const count = imgData.length / 4;

            for (let i = 0; i < imgData.length; i += 4) {
              rTotal += imgData[i];
              gTotal += imgData[i + 1];
              bTotal += imgData[i + 2];
            }

            const hsl = rgbToHsl(rTotal / count, gTotal / count, bTotal / count);
            const group = getHueGroup(hsl.hue);
            cleanup();
            resolve({ colorGroup: group, hue: hsl.hue });
          } catch (e) {
            cleanup();
            resolve({ colorGroup: 'Blue', hue: 210 });
          }
        };

        tempVideo.onerror = () => {
          cleanup();
          resolve({ colorGroup: 'Blue', hue: 210 });
        };
      });
    }

    async function scanAllClips() {
      statusText.innerText = "Analyzing video colors...";
      for (let i = 0; i < videoClips.length; i++) {
        if (!videoClips[i].colorGroup) {
          const colorData = await analyzeVideoColor(videoClips[i].url);
          videoClips[i].colorGroup = colorData.colorGroup;
          videoClips[i].hue = colorData.hue;
          renderClipList();
        }
      }
      statusText.innerText = `Ready! (${videoClips.length} clips analyzed)`;
      if (currentClipObject) updateColorBadge(currentClipObject.colorGroup);
    }

    function updateColorBadge(group) {
      colorBadge.innerText = `Active Color: ${group || 'Scanning...'}`;
    }

    // --- INDEXEDDB BINARY PERSISTENCE ---
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('BPMVisualizerMediaDB', 4);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('audio')) db.createObjectStore('audio');
          if (db.objectStoreNames.contains('videos')) db.deleteObjectStore('videos');
          db.createObjectStore('videos', { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveAudioToStorage(file) {
      statusText.innerText = "Saving audio track...";
      const buffer = await file.arrayBuffer();
      const db = await openDB();
      const tx = db.transaction('audio', 'readwrite');
      tx.objectStore('audio').put({ data: buffer, type: file.type }, 'currentTrack');
    }

    async function addVideosToStorage(items) {
      statusText.innerText = "Saving video clips...";
      const db = await openDB();
      const tx = db.transaction('videos', 'readwrite');
      const store = tx.objectStore('videos');

      for (const item of items) {
        store.put({ id: item.id, data: item.buffer, type: item.type, name: item.name });
      }
    }

    async function removeVideoFromStorage(id) {
      const db = await openDB();
      const tx = db.transaction('videos', 'readwrite');
      tx.objectStore('videos').delete(id);
    }

    async function loadSavedMedia() {
      try {
        const db = await openDB();

        // 1. Load Audio
        const audioTx = db.transaction('audio', 'readonly');
        const audioReq = audioTx.objectStore('audio').get('currentTrack');
        audioReq.onsuccess = () => {
          if (audioReq.result && audioReq.result.data) {
            rawAudioArrayBuffer = audioReq.result.data;
            audioBuffer = null;
          }
        };

        // 2. Load Videos
        const videoTx = db.transaction('videos', 'readonly');
        const videoReq = videoTx.objectStore('videos').getAll();
        videoReq.onsuccess = async () => {
          if (videoReq.result && videoReq.result.length > 0) {
            const records = videoReq.result;
            videoClips = records.map(record => {
              const blob = new Blob([record.data], { type: record.type });
              return {
                id: record.id,
                url: URL.createObjectURL(blob),
                colorGroup: null,
                hue: null,
                name: record.name || 'Saved Clip'
              };
            });

            currentClipObject = videoClips[0];
            activeVideo.src = currentClipObject.url;
            recentClips = [currentClipObject.url];
            activeVideo.muted = true;
            activeVideo.play().catch(() => {});
            activeVideo.classList.add('active');
            resizeCanvas();

            renderClipList();
            await scanAllClips();
          } else {
            renderClipList();
            statusText.innerText = "Select files to begin.";
          }
        };
      } catch (err) {
        renderClipList();
        statusText.innerText = "Select files to begin.";
      }
    }

    async function clearStorage() {
      try {
        const db = await openDB();
        const tx1 = db.transaction('audio', 'readwrite');
        tx1.objectStore('audio').clear();
        const tx2 = db.transaction('videos', 'readwrite');
        tx2.objectStore('videos').clear();

        videoClips.forEach(c => URL.revokeObjectURL(c.url));
        videoClips = [];
        recentClips = [];
        rawAudioArrayBuffer = null;
        audioBuffer = null;
        currentClipObject = null;
        stopAudio();
        activeVideo.src = '';
        inactiveVideo.src = '';
        activeVideo.classList.remove('active');
        inactiveVideo.classList.remove('active');
        renderClipList();
        statusText.innerText = "Cleared all saved media.";
        colorBadge.innerText = "Active Color: None";
      } catch(e) {
        console.error(e);
      }
    }

    // --- UI & CLIP LIST RENDERER ---
    function renderClipList() {
      const container = document.getElementById('clip-list');
      if (!container) return;

      if (videoClips.length === 0) {
        container.innerHTML = '<div style="font-size:0.75rem; color:#666; text-align:center; padding:8px;">No video clips uploaded</div>';
        return;
      }

      container.innerHTML = '';
      videoClips.forEach((clip, index) => {
        const item = document.createElement('div');
        item.className = 'clip-item';

        const videoThumb = document.createElement('video');
        videoThumb.className = 'clip-thumb';
        videoThumb.src = clip.url + '#t=0.5';
        videoThumb.muted = true;
        videoThumb.preload = 'metadata';

        const info = document.createElement('div');
        info.className = 'clip-info';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'clip-name';
        nameSpan.innerText = clip.name || `Clip ${index + 1}`;

        const colorSpan = document.createElement('span');
        colorSpan.className = 'clip-color-tag';
        colorSpan.innerText = clip.colorGroup ? `Color: ${clip.colorGroup}` : 'Scanning...';

        info.appendChild(nameSpan);
        info.appendChild(colorSpan);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-del-clip';
        delBtn.innerHTML = '✕';
        delBtn.title = 'Remove clip';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteClip(clip.id);
        };

        item.appendChild(videoThumb);
        item.appendChild(info);
        item.appendChild(delBtn);

        container.appendChild(item);
      });
    }

    async function deleteClip(id) {
      const index = videoClips.findIndex(c => c.id === id);
      if (index === -1) return;

      const [removed] = videoClips.splice(index, 1);
      recentClips = recentClips.filter(u => u !== removed.url);
      URL.revokeObjectURL(removed.url);

      await removeVideoFromStorage(id);

      if (currentClipObject && currentClipObject.id === id) {
        if (videoClips.length > 0) {
          currentClipObject = videoClips[0];
          activeVideo.src = currentClipObject.url;
          activeVideo.play().catch(() => {});
          updateColorBadge(currentClipObject.colorGroup);
        } else {
          currentClipObject = null;
          activeVideo.src = '';
          inactiveVideo.src = '';
          activeVideo.classList.remove('active');
          inactiveVideo.classList.remove('active');
          updateColorBadge('None');
        }
      }

      renderClipList();
      statusText.innerText = `Removed clip. (${videoClips.length} remaining)`;
    }

    // --- FILE INPUT HANDLING ---
    document.getElementById('video-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      statusText.innerText = "Processing video clips...";
      const newItemsToStore = [];

      for (const file of files) {
        const id = 'vid_' + Date.now() + '_' + Math.random().toString(36).substr(2, 7);
        const buffer = await file.arrayBuffer();
        const blob = new Blob([buffer], { type: file.type || 'video/mp4' });
        const url = URL.createObjectURL(blob);

        const clipObj = {
          id: id,
          url: url,
          colorGroup: null,
          hue: null,
          name: file.name
        };

        videoClips.push(clipObj);
        newItemsToStore.push({ id, buffer, type: file.type || 'video/mp4', name: file.name });
      }

      if (!currentClipObject && videoClips.length > 0) {
        currentClipObject = videoClips[0];
        activeVideo.src = currentClipObject.url;
        recentClips = [currentClipObject.url];
        activeVideo.muted = true;
        activeVideo.play().catch(() => {});
        activeVideo.classList.add('active');
        resizeCanvas();
      }

      renderClipList();
      await addVideosToStorage(newItemsToStore);
      await scanAllClips();
      e.target.value = '';
    });

    document.getElementById('audio-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      rawAudioArrayBuffer = await file.arrayBuffer();
      audioBuffer = null;
      await saveAudioToStorage(file);
      statusText.innerText = "Audio loaded! Press START";
    });

    // --- PLAYBACK ENGINE ---
    async function togglePlay() {
      if (!rawAudioArrayBuffer && !audioBuffer) {
        alert("Please load a song file first!");
        return;
      }

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      if (!audioBuffer && rawAudioArrayBuffer) {
        statusText.innerText = "Decoding audio...";
        audioBuffer = await audioCtx.decodeAudioData(rawAudioArrayBuffer.slice(0));
      }

      if (isPlaying) {
        stopAudio();
        statusText.innerText = "Paused";
        return;
      }

      startAudio();
    }

    function startAudio() {
      if (sourceNode) {
        try { sourceNode.stop(); } catch(e) {}
      }

      sourceNode = audioCtx.createBufferSource();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;

      sourceNode.buffer = audioBuffer;
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      sourceNode.onended = () => {
        isPlaying = false;
        statusText.innerText = "Finished. Press START to replay.";
      };

      sourceNode.start(0);
      isPlaying = true;

      uiLayer.classList.add('hidden');
      statusText.innerText = "Playing...";

      resizeCanvas();
      renderFrame();
    }

    function stopAudio() {
      isPlaying = false;
      if (sourceNode) {
        try { sourceNode.stop(); } catch(e) {}
        sourceNode = null;
      }
    }

    // --- COLOR-HARMONIC CLIP SWITCHER ---
    function selectNextClip() {
      if (videoClips.length === 0) return null;

      const curGroup = currentClipObject ? currentClipObject.colorGroup || 'Red' : 'Red';
      const targetOrder = COLOR_NEIGHBORS[curGroup] || COLOR_NEIGHBORS['Red'];

      let candidatePool = videoClips.filter(clip => !recentClips.includes(clip.url));

      if (candidatePool.length === 0) {
        candidatePool = videoClips.filter(clip => clip.url !== activeVideo.src);
        if (candidatePool.length === 0) candidatePool = videoClips;
      }

      for (const groupName of targetOrder) {
        const matches = candidatePool.filter(c => c.colorGroup === groupName);
        if (matches.length > 0) {
          return matches[Math.floor(Math.random() * matches.length)];
        }
      }

      return candidatePool[Math.floor(Math.random() * candidatePool.length)];
    }

    function switchVideoClip() {
      if (videoClips.length === 0 || isSwapping) return;

      const nextClipObject = selectNextClip();
      if (!nextClipObject) return;

      recentClips.push(nextClipObject.url);
      if (recentClips.length > 7) {
        recentClips.shift();
      }

      isSwapping = true;
      inactiveVideo.muted = true;

      const performVisualSwap = () => {
        inactiveVideo.classList.add('active');
        activeVideo.classList.remove('active');

        let temp = activeVideo;
        activeVideo = inactiveVideo;
        inactiveVideo = temp;

        currentClipObject = nextClipObject;
        updateColorBadge(currentClipObject.colorGroup);
        isSwapping = false;
      };

      const prepareAndPlay = () => {
        if (inactiveVideo.duration && inactiveVideo.duration > 1.5) {
          inactiveVideo.currentTime = Math.random() * (inactiveVideo.duration - 1.5) + 0.5;
        }

        const onReadyToReveal = () => {
          inactiveVideo.removeEventListener('playing', onReadyToReveal);
          inactiveVideo.removeEventListener('seeked', onReadyToReveal);
          performVisualSwap();
        };

        inactiveVideo.addEventListener('playing', onReadyToReveal, { once: true });
        inactiveVideo.addEventListener('seeked', onReadyToReveal, { once: true });

        inactiveVideo.play().catch(() => {
          isSwapping = false;
        });

        setTimeout(() => {
          if (isSwapping) performVisualSwap();
        }, 150);
      };

      if (inactiveVideo.src !== nextClipObject.url) {
        inactiveVideo.src = nextClipObject.url;
        inactiveVideo.onloadeddata = () => {
          inactiveVideo.onloadeddata = null;
          prepareAndPlay();
        };
      } else {
        prepareAndPlay();
      }
    }

    // --- RENDER LOOP ---
    function renderFrame() {
      if (!isPlaying || !analyser) return;

      const freqData = new Uint8Array(analyser.frequencyBinCount);
      const timeData = new Uint8Array(analyser.fftSize);

      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);

      let totalEnergy = 0;
      for (let i = 0; i < freqData.length; i++) totalEnergy += freqData[i];
      const avgEnergy = totalEnergy / freqData.length;
      smoothedEnergy += (avgEnergy - smoothedEnergy) * 0.1;

      const quietThreshold = parseInt(quietSlider.value, 10);
      const hideThreshold = parseInt(hideSlider.value, 10);
      const beatThreshold = parseInt(sensSlider.value, 10);
      const minHoldMs = parseFloat(holdSlider.value) * 1000;

      if (smoothedEnergy >= hideThreshold) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      } else if (smoothedEnergy < quietThreshold) {
        drawRoundVisualizer(timeData);
      } else {
        drawSharpVisualizer(timeData);
      }

      const bassEnergy = (freqData[1] + freqData[2] + freqData[3] + freqData[4]) / 4;
      smoothedBass += (bassEnergy - smoothedBass) * 0.05;

      const now = performance.now();
      const timeSinceLastBeat = now - lastBeatTime;
      const isTrueSpike = bassEnergy > (smoothedBass * 1.2);

      if (smoothedEnergy >= quietThreshold && timeSinceLastBeat > minHoldMs && (bassEnergy > beatThreshold || (isTrueSpike && bassEnergy > 90))) {
        lastBeatTime = now;
        switchVideoClip();
      }

      requestAnimationFrame(renderFrame);
    }

    function drawRoundVisualizer(dataArray) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffffff';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const baseRadius = Math.min(canvas.width, canvas.height) * 0.22;
      const numPoints = dataArray.length;

      const points = [];
      for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2 - Math.PI / 2;
        const v = (dataArray[i] - 128) / 128.0; 
        const r = baseRadius + (v * baseRadius * 0.55);
        points.push({
          x: centerX + Math.cos(angle) * r,
          y: centerY + Math.sin(angle) * r
        });
      }

      if (points.length === 0) return;

      ctx.beginPath();
      let lastPt = points[points.length - 1];
      let firstMidX = (lastPt.x + points[0].x) / 2;
      let firstMidY = (lastPt.y + points[0].y) / 2;
      ctx.moveTo(firstMidX, firstMidY);

      for (let i = 0; i < points.length; i++) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        ctx.quadraticCurveTo(p1.x, p1.y, midX, midY);
      }

      ctx.closePath();
      ctx.stroke();
    }

    function drawSharpVisualizer(dataArray) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffffff';
      ctx.lineCap = 'square';
      ctx.lineJoin = 'miter';

      ctx.beginPath();
      const sliceWidth = canvas.width / dataArray.length;
      let x = 0;

      for (let i = 0; i < dataArray.length; i++) {
        const v = dataArray[i] / 128.0;
        const y = (v * canvas.height) / 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += sliceWidth;
      }
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
    }

    // --- EVENT BINDINGS ---
    startBtn.addEventListener('click', togglePlay);
    clearBtn.addEventListener('click', clearStorage);
    toggleUiBtn.addEventListener('click', () => uiLayer.classList.toggle('hidden'));
    sensSlider.addEventListener('input', (e) => document.getElementById('sens-val').innerText = e.target.value);
    quietSlider.addEventListener('input', (e) => document.getElementById('quiet-val').innerText = e.target.value);
    hideSlider.addEventListener('input', (e) => document.getElementById('hide-val').innerText = e.target.value);
    holdSlider.addEventListener('input', (e) => document.getElementById('hold-val').innerText = `${e.target.value}s`);

    // Initialization
    resizeCanvas();
    loadSavedMedia();
  </script>
</body>
</html>
